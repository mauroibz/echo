schema: spec-driven

context: |
  Echo is a single-user Linux desktop app (Fedora KDE, PipeWire) for recording long-form
  audio and transcribing Spanish speech locally on an NVIDIA GPU. docs/design.md holds the
  architecture and the reasons behind it.
  Hard constraints:
  - No audio may ever be lost. Recording must survive UI crashes, SIGKILL and power loss.
  - Lean and finished: few features done completely, no flags hiding unfinished work.
  - Installs per-user only. Never use or write to the system Python. Dependencies are
    hash-locked with uv, wheels only, no trust_remote_code, model revisions pinned.
  - The UI process never imports torch.
  - The CLI command is `echo-app` (a command named `echo` is shadowed by the shell builtin).

