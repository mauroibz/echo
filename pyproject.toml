[project]
name = "echo-app"
version = "0.1.0"
description = "Record long-form audio and transcribe Spanish speech locally."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro" }]
dependencies = [
    "PySide6-Essentials>=6.11",
    "numpy>=2.3",
    # Audio where PipeWire is not available (Windows, macOS, PulseAudio-only Linux).
    "sounddevice>=0.5",
    # The desktop trash on every OS.
    "send2trash>=1.8",
]

[project.optional-dependencies]
# Local transcription, one extra per compute profile; they differ only in where torch comes
# from. cuda: NVIDIA GPUs, torch from PyPI with bundled CUDA libraries (~3.5 GB). cpu: any
# processor, torch's CPU-only wheels (~200 MB). rocm: AMD GPUs on Linux.
cuda = ["torch>=2.10", "transformers>=5.12", "peft>=0.19", "silero-vad>=6.2"]
cpu = ["torch>=2.10", "transformers>=5.12", "peft>=0.19", "silero-vad>=6.2"]
rocm = ["torch>=2.10", "transformers>=5.12", "peft>=0.19", "silero-vad>=6.2",
        "triton-rocm; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The app is run from the source tree by bin/echo-app; uv installs dependencies only,
# so no build backend is needed.
package = false
# Never fall back to /usr/bin/python3.
python-preference = "only-managed"
# Refuse packages published after this date. Bump deliberately when updating the lock,
# keeping a margin of at least two weeks behind the current date.
exclude-newer = "2026-10-09T00:00:00Z"
# Wheels only: no third-party build scripts run at install time.
no-build = true
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }, { extra = "rocm" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
    # PyPI's torch bundles CUDA on Linux but is CPU-only on Windows.
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
# The ROCm build of torch needs ROCm's triton, which only that index has.
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
