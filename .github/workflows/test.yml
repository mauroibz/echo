# The fast suite on Ubuntu and Fedora, and a resolution check of every transcription profile.
# No GPU, microphone or model is needed; the hardware suites stay opt-in (see README).
name: test

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
      - name: Environment
        run: |
          uv python install
          uv sync --locked --no-install-project
      - name: Lockfile in sync
        run: uv lock --check
      - name: Transcription profiles resolve
        run: |
          for profile in cuda cpu rocm; do
            uv sync --locked --no-install-project --extra "$profile" --dry-run
          done
      - name: Tests
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: System packages
        run: |
          dnf install -y git uv ffmpeg-free mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs glib2 \
            xcb-util-cursor
      - uses: actions/checkout@v4
      - name: Environment
        # Fedora's uv turns automatic Python downloads off; install the pinned one explicitly.
        run: |
          uv python install
          uv sync --locked --no-install-project
      - name: Lockfile in sync
        run: uv lock --check
      - name: Transcription profiles resolve
        run: |
          for profile in cuda cpu rocm; do
            uv sync --locked --no-install-project --extra "$profile" --dry-run
          done
      - name: Tests
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

